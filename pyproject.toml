[project]
name = "pestrail"
# Single source of truth: __version__ in src/pestrail/__init__.py (see [tool.hatch.version]).
dynamic = ["version"]
description = "A safety-first MCP server for TestRail: browse projects, cases, runs and plans, add results and attachments. It cannot delete anything."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "pestrail contributors" }]
keywords = ["testrail", "mcp", "model-context-protocol", "qa", "test-management", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<0.29",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.0,<2",
    "truststore>=0.10,<1",
]

[project.scripts]
pestrail = "pestrail.__main__:main"

[project.urls]
Homepage = "https://github.com/poyrazemun/pestrail"
Issues = "https://github.com/poyrazemun/pestrail/issues"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pestrail/__init__.py"

[tool.uv]
# The version is read from __init__.py (dynamic), so uv must rebuild the project's
# metadata when that file changes, not only when pyproject.toml does.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/pestrail/__init__.py" }]

[tool.hatch.build.targets.wheel]
packages = ["src/pestrail"]

[tool.hatch.build.targets.sdist]
include = ["src/pestrail", "tests", "README.md", "LICENSE", ".env.example", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
# `uv run mypy` checks all of these. The package is strict; tests are type-checked
# (including untyped test functions) without requiring annotations everywhere.
python_version = "3.11"
files = ["src/pestrail", "tests", ".github/scripts"]
mypy_path = "src"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# Only used by one test, and it ships no type information.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
